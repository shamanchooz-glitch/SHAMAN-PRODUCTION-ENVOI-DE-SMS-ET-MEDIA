<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscription</title>
<style>
  :root{ --bg:#EAF5FC; --card:#fff; --ink:#14263a; --dim:#4a6176; --pink:#d6336c; --line:#cfe3f0; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap{ max-width:520px; margin:0 auto; padding:18px 14px 40px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 4px 18px rgba(20,38,58,.06); }
  h1{ font-size:22px; margin:0 0 4px; line-height:1.25; }
  .sub{ color:var(--dim); margin:0 0 16px; }
  label{ display:block; font-weight:700; margin:14px 0 4px; font-size:14px; }
  input[type=text],input[type=tel]{ width:100%; font-size:17px; padding:12px; border:1.5px solid var(--line); border-radius:12px; background:#f6fbff; color:var(--ink); }
  input:focus{ outline:none; border-color:var(--pink); }
  .consent{ display:flex; gap:10px; align-items:flex-start; margin:18px 0 6px; font-size:14px; line-height:1.4; font-weight:400; }
  .consent input{ width:22px; height:22px; margin-top:2px; flex:0 0 auto; }
  .btn{ display:block; width:100%; text-align:center; text-decoration:none; font-size:17px; font-weight:700; color:#fff; background:linear-gradient(135deg,#f0508a,#ff8fbd); border:0; border-radius:14px; padding:15px; margin-top:12px; cursor:pointer; }
  .btn[aria-disabled=true]{ opacity:.45; pointer-events:none; }
  .alt{ background:#fff; color:var(--pink); border:2px solid var(--pink); }
  .note{ font-size:12.5px; color:var(--dim); margin-top:14px; line-height:1.45; }
  textarea{ width:100%; min-height:110px; font-size:14px; padding:10px; border:1.5px solid var(--line); border-radius:12px; background:#f6fbff; color:var(--ink); }
  .err{ color:#c43e3e; font-weight:700; }
  .ok{ color:#1f8a4c; font-weight:700; }
  .hide{ display:none; }
  .or{ text-align:center; color:var(--dim); margin:14px 0 0; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <h1 id="title">Inscription</h1>
    <p class="sub" id="sub"></p>
    <div id="fields"></div>
    <div id="phoneBox" class="hide">
      <label for="phone">Votre numéro de téléphone (pour l'envoi par internet)</label>
      <input type="tel" id="phone" inputmode="tel" autocomplete="tel" placeholder="07 48 93 56 86">
    </div>
    <label class="consent" for="ok"><input type="checkbox" id="ok"><span id="consentTxt"></span></label>
    <a class="btn" id="go" aria-disabled="true" href="#">📱 Envoyer mon inscription par SMS</a>
    <p class="or hide" id="orTxt">— ou, si le SMS ne s'ouvre pas ou si vous n'avez pas de crédit —</p>
    <button class="btn alt hide" id="net" type="button" aria-disabled="true">🌐 Envoyer par internet (gratuit)</button>
    <div class="note" id="how"></div>
    <p class="hide" id="status"></p>
    <div id="fallback" class="hide">
      <p class="note">Si votre messagerie ne s'est pas ouverte, envoyez ce message vous-même au <b id="fbNum"></b> :</p>
      <textarea id="fbMsg" readonly></textarea>
      <button class="btn alt" id="copy" type="button">Copier le message</button>
    </div>
    <p class="err hide" id="err"></p>
  </div>
</div>
<script>
(function(){
  var DB = 'https://shaman-chooz-chanel-default-rtdb.firebaseio.com', PATH = 'sms-app/inscriptions';
  var q = new URLSearchParams(location.search);
  if(q.get('db')) DB = q.get('db').replace(/\/+$/, '');
  var raw = (q.get('n') || '').replace(/[^\d+]/g, ''), digits = raw.replace(/\D/g, ''), num = '';
  if(digits.length === 10 && digits[0] === '0') num = '+225' + digits;
  else if(digits.length === 13 && digits.indexOf('225') === 0) num = '+' + digits;
  else if(digits.length >= 9) num = '+' + digits;
  var kw = (q.get('k') || 'INSCRIPTION').slice(0, 40);
  var type = q.get('t') === 'wa' ? 'wa' : 'sms';
  var fields = (q.get('f') || 'Nom,Métier,Quartier').split(',').map(function(x){ return x.trim(); }).filter(Boolean).slice(0, 12);
  var agency = (q.get('a') || '').slice(0, 80), title = (q.get('ti') || 'Inscrivez-vous').slice(0, 90), sub = (q.get('su') || '').slice(0, 120);
  var pk = q.get('pk') || '', token = q.get('w') || '';
  var canNet = !!(pk && token && window.crypto && crypto.subtle);
  document.title = title;
  document.getElementById('title').textContent = title;
  document.getElementById('sub').textContent = sub;
  var consent = q.get('c') || ("J'accepte de recevoir des offres d'emploi" + (agency ? ' de ' + agency : '') + ". Je peux écrire STOP pour arrêter.");
  document.getElementById('consentTxt').textContent = consent;
  var box = document.getElementById('fields');
  fields.forEach(function(f, i){
    var l = document.createElement('label'); l.textContent = f; l.setAttribute('for', 'f' + i);
    var inp = document.createElement('input'); inp.type = 'text'; inp.id = 'f' + i; inp.autocomplete = 'off'; inp.maxLength = 80;
    box.appendChild(l); box.appendChild(inp);
  });
  var go = document.getElementById('go'), net = document.getElementById('net'), ok = document.getElementById('ok');
  function show(id, on){ document.getElementById(id).classList[on ? 'remove' : 'add']('hide'); }
  if(!num){ var e = document.getElementById('err'); e.textContent = "Lien d'inscription incomplet : le numéro de réception est manquant."; show('err', true); go.style.display = 'none'; return; }
  if(type === 'wa') go.textContent = '💬 Envoyer mon inscription par WhatsApp';
  if(canNet){ show('phoneBox', true); show('net', true); show('orTxt', true); }
  document.getElementById('how').textContent = (type === 'wa'
    ? "En touchant le bouton, WhatsApp s'ouvre avec votre message déjà écrit : il ne vous reste qu'à l'envoyer."
    : "En touchant le bouton, votre messagerie SMS s'ouvre avec votre message déjà écrit : il ne vous reste qu'à l'envoyer.")
    + (canNet ? " Si le SMS ne s'ouvre pas, ou sans crédit SMS, utilisez l'envoi par internet : il faut alors indiquer votre numéro." : "") + " Votre accord est enregistré avec votre inscription.";
  function val(i){ return (document.getElementById('f' + i).value || '').replace(/\s+/g, ' ').trim(); }
  function message(){
    var lines = [kw];
    fields.forEach(function(f, i){ lines.push(f + ': ' + val(i)); });
    lines.push('Accord SMS: OUI');
    return lines.join('\n');
  }
  function link(){
    var m = message();
    if(type === 'wa') return 'https://wa.me/' + num.replace(/\D/g, '') + '?text=' + encodeURIComponent(m);
    return 'sms:' + num + (/iPhone|iPad|iPod/i.test(navigator.userAgent) ? '&' : '?') + 'body=' + encodeURIComponent(m);
  }
  function phoneOk(){ var d = document.getElementById('phone').value.replace(/\D/g, ''); return d.length === 10 || (d.length === 13 && d.indexOf('225') === 0); }
  function refresh(){
    var firstOk = !fields.length || val(0).length > 0, base = ok.checked && firstOk;
    go.setAttribute('aria-disabled', base ? 'false' : 'true'); go.href = base ? link() : '#';
    net.setAttribute('aria-disabled', (base && phoneOk()) ? 'false' : 'true');
    document.getElementById('fbMsg').value = message(); document.getElementById('fbNum').textContent = num;
  }
  box.addEventListener('input', refresh); ok.addEventListener('change', refresh); document.getElementById('phone').addEventListener('input', refresh);
  go.addEventListener('click', function(){ show('fallback', true); });
  document.getElementById('copy').addEventListener('click', function(){ var t = document.getElementById('fbMsg'); t.select(); try{ document.execCommand('copy'); this.textContent = 'Message copié ✔'; }catch(e){} });
  // ---- envoi par internet : le contenu est CHIFFRÉ ici avec la clé publique de l'agence ; seul son téléphone peut le lire ----
  function b64u(buf){ var u = new Uint8Array(buf), s = ''; for(var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function unb64u(t){ t = t.replace(/-/g, '+').replace(/_/g, '/'); while(t.length % 4) t += '='; var s = atob(t), u = new Uint8Array(s.length); for(var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  async function encryptFor(obj){
    var pub = await crypto.subtle.importKey('raw', unb64u(pk), { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    var eph = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'ECDH', public: pub }, eph.privateKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
    return { e: b64u(await crypto.subtle.exportKey('raw', eph.publicKey)), i: b64u(iv), c: b64u(ct) };
  }
  net.addEventListener('click', async function(){
    if(net.getAttribute('aria-disabled') === 'true') return;
    var st = document.getElementById('status'); st.className = ''; st.textContent = 'Envoi en cours…';
    net.setAttribute('aria-disabled', 'true');
    try{
      var f = {}; fields.forEach(function(name, i){ f[name] = val(i); });
      var payload = await encryptFor({ phone: document.getElementById('phone').value.trim(), f: f, kw: kw, consent: true, ts: Date.now() });
      payload.ts = Date.now();
      var res = await fetch(DB + '/' + PATH + '/' + encodeURIComponent(token) + '.json', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      st.className = 'ok'; st.textContent = '✅ Inscription envoyée par internet. Merci ! Nous vous contacterons.';
      net.style.display = 'none'; go.style.display = 'none';
    }catch(err){
      st.className = 'err'; st.textContent = "Envoi impossible pour le moment (" + (err && err.message ? err.message : err) + "). Réessayez, ou utilisez l'envoi par SMS.";
      net.setAttribute('aria-disabled', 'false');
    }
  });
  refresh();
})();
</script>
</body>
</html>
